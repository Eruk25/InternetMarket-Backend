services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:MSSQLDanilaMatush23}
    ports:
      - "1433:1433"
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P "${SA_PASSWORD:-YourStr@ngPassw0rd!}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - sqlserver-data:/var/opt/mssql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  productservice:
    build:
      context: ..
      dockerfile: Backend/src/InternetMarket.ProductService/InternetMarket.ProductService.API/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=ProductService;TrustServerCertificate=True;User Id=SA;Password=${SA_PASSWORD:MSSQLDanilaMatush23}
      - Redis__Configuration=redis:6379
    ports:
      - "5206:5206"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_started

  cartservice:
    build:
      context: ..
      dockerfile: Backend/src/InternetMarket.CartService/InternetMarket.CartService.API/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=CartService;TrustServerCertificate=True;User Id=SA;Password=${SA_PASSWORD:MSSQLDanilaMatush23}
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=guest
      - RabbitMq__Password=guest
      - ProductService__BaseUrl=http://productservice:5206
    ports:
      - "5203:5203"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  orderservice:
    build:
      context: ..
      dockerfile: Backend/src/InternetMarket.OrderService/InternetMarket.OrderService.API/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=OrderService;TrustServerCertificate=True;User Id=SA;Password=${SA_PASSWORD:MSSQLDanilaMatush23}
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=guest
      - RabbitMq__Password=guest
      - CartService__BaseUrl=http://cartservice:5203
      - ProductService__BaseUrl=http://productservice:5206
    ports:
      - "5207:5207"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  paymentservice:
    build:
      context: ..
      dockerfile: Backend/src/InternetMarket.PaymentService/InternetMarket.PaymentService.API/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=PaymentService;TrustServerCertificate=True;User Id=SA;Password=${SA_PASSWORD:MSSQLDanilaMatush23}
      - RabbitMq__Host=rabbitmqMSSQLDanilaMatush23- RabbitMq__Password=guest
      - OrderService__BaseUrl=http://orderservice:5207
      - BepaidService__BaseUrl=${BEPAID_BASE_URL:-https://api.bepaid.com}
    ports:
      - "5235:5235"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  shipmentservice:
    build:
      context: ..
      dockerfile: Backend/src/InternetMarket.ShipmentService/InternetMarket.ShipmentService.API/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=ShipmentService;TrustServerCertificate=True;User Id=SA;Password=${SA_PASSWORD:MSSQLDanilaMatush23}
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=guest
      - RabbitMq__Password=guest
      - Redis__Configuration=redis:6379
    ports:
      - "5260:5260"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      redis:
        condition: service_started

  emailservice:
    build:
      context: ..
      dockerfile: Backend/src/InternetMarket.EmailService/InternetMarket.EmailService.API/Dockerfile
    environment:
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=guest
      - RabbitMq__Password=guest
    ports:
      - "5192:5192"
    depends_on:
      rabbitmq:
        condition: service_started

  userservice:
    build:
      context: ..
      dockerfile: Backend/src/InternetMarket.UserService/InternetMarket.UserService.API/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=UserService;TrustServerCertificate=True;User Id=SA;Password=${SA_PASSWORD:MSSQLDanilaMatush23}
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=guest
      - RabbitMq__Password=guest
    ports:
      - "5287:5287"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  gateway:
    build:
      context: ..
      dockerfile: Backend/src/InternetMarket.Gateway/Dockerfile
    ports:
      - "5146:5146"
    depends_on:
      - productservice
      - cartservice
      - orderservice
      - paymentservice
      - shipmentservice
      - emailservice
      - userservice

volumes:
  sqlserver-data:
  redis-data:
  rabbitmq-data:
